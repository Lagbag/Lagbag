  <rect x="60" y="154" width="380" height="2" rx="1" fill="url(#accent)"/>

  <text x="1164" y="142" text-anchor="end" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" fill="#7d8096">python · rust · postgres</text>
  <text x="1164" y="164" text-anchor="end" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" fill="#7d8096">fastapi · django · docker</text>
